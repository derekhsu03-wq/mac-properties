    const YearControl = L.Control.TimeDimension.extend({

    map.addControl(new YearControl({

    function currentYear() {
      return new Date(map.timeDimension.getCurrentTime()).getUTCFullYear();

    function details(p) {
      // textContent keeps CSV values from being interpreted as HTML
      const div = document.createElement(&#x27;div&#x27;);
      div.className = &#x27;details&#x27;;
      const title = document.createElement(&#x27;strong&#x27;);
      title.textContent = p.address;
      div.append(
        title, document.createElement(&#x27;br&#x27;),
        &#x27;Acquired: &#x27; + p.year, document.createElement(&#x27;br&#x27;),
        &#x27;Deed: &#x27; + (p.deed || &#x27;n/a&#x27;), document.createElement(&#x27;br&#x27;),
        &#x27;LLC: &#x27; + (p.llc || &#x27;n/a&#x27;),
      );

      if (p.values.length) {
        const table = document.createElement(&#x27;table&#x27;);
        for (const v of p.values) {
          const row = table.insertRow();
          cell(row, v.year);
          cell(row, money.format(v.value), &#x27;num&#x27;);
          if (v.pct === null) {
            cell(row, &#x27;&#x27;);
          } else {
            cell(row, (v.pct &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;) + v.pct.toFixed(1) + &#x27;%&#x27;, &#x27;num &#x27; + (v.pct &gt;= 0 ? &#x27;up&#x27; : &#x27;down&#x27;));

      return div;

    const baseLayer = L.geoJSON(PROPERTIES, {

    L.timeDimension.layer.geoJson(baseLayer, {

    };

    const W = 480, H = 300, M = { top: 10, right: 10, bottom: 44, left: 44 };
    const MAX_ROWS = 15;
    const SVG_NS = &#x27;http://www.w3.org/2000/svg&#x27;;

    const pct = (x) =&gt; Math.round(x * 100) + &#x27;%&#x27;;

    function svgEl(tag, attrs, parent) {
      const e = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    }

    function cell(row, text, className) {
      const td = row.insertCell();
      td.textContent = text;
      if (className) td.className = className;
    }

    function details(chart, bin) {
      // textContent keeps CSV values from being interpreted as HTML
      const div = document.createElement(&#x27;div&#x27;);
      div.className = &#x27;details&#x27;;
      const title = document.createElement(&#x27;strong&#x27;);
      title.textContent = bin.lo + &#x27;–&#x27; + bin.hi + &#x27;% of &#x27; + chart.label.toLowerCase() + &#x27; under Mac&#x27;;
      div.append(title, document.createElement(&#x27;br&#x27;), &#x27;Properties: &#x27; + bin.count);

      const table = document.createElement(&#x27;table&#x27;);
      for (const item of bin.items.slice(0, MAX_ROWS)) {
        const row = table.insertRow();
        cell(row, item.address);
        cell(row, item.mac + &#x27; / &#x27; + item.total, &#x27;num&#x27;);
        cell(row, pct(item.share), &#x27;num&#x27;);
      }
      div.append(table);
      if (bin.items.length &gt; MAX_ROWS) {
        const more = document.createElement(&#x27;div&#x27;);
        more.className = &#x27;more&#x27;;
        more.textContent = &#x27;+ &#x27; + (bin.items.length - MAX_ROWS) + &#x27; more&#x27;;
        div.append(more);
      }
      return div;
    }

    function showTip(evt, content) {
      if (content) tip.replaceChildren(content);
      tip.style.display = &#x27;block&#x27;;
      let x = evt.clientX + 14, y = evt.clientY + 14;
      if (x + tip.offsetWidth &gt; innerWidth) x = evt.clientX - tip.offsetWidth - 14;
      if (y + tip.offsetHeight &gt; innerHeight) y = Math.max(4, innerHeight - tip.offsetHeight - 4);
      tip.style.left = x + &#x27;px&#x27;;
      tip.style.top = y + &#x27;px&#x27;;
    }

    function render(chart) {
      const wrap = document.createElement(&#x27;div&#x27;);
      wrap.className = &#x27;chart&#x27;;
      const h2 = document.createElement(&#x27;h2&#x27;);
      h2.textContent = chart.title;
      const p = document.createElement(&#x27;p&#x27;);
      p.textContent = &#x27;n = &#x27; + chart.n + &#x27; properties with at least one &#x27; + chart.label.toLowerCase().replace(/s$/, &#x27;&#x27;) + &#x27; · median &#x27; + pct(chart.median);
      wrap.append(h2, p);
      document.getElementById(&#x27;charts&#x27;).append(wrap);

      const svg = svgEl(&#x27;svg&#x27;, { viewBox: &#x27;0 0 &#x27; + W + &#x27; &#x27; + H, role: &#x27;img&#x27;, &#x27;aria-label&#x27;: chart.title }, wrap);
      const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
      const maxCount = Math.max(1, ...chart.bins.map((b) =&gt; b.count));
      const step = Math.max(1, Math.ceil(maxCount / 5));
      const yMax = Math.ceil(maxCount / step) * step;
      const y = (v) =&gt; M.top + ih - (v / yMax) * ih;
      const bw = iw / chart.bins.length;

      for (let t = 0; t &lt;= yMax; t += step) {
        svgEl(&#x27;line&#x27;, { x1: M.left, x2: W - M.right, y1: y(t), y2: y(t), class: &#x27;grid&#x27; }, svg);
        svgEl(&#x27;text&#x27;, { x: M.left - 6, y: y(t) + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;tick&#x27; }, svg).textContent = t;
      }

      chart.bins.forEach((bin, i) =&gt; {
        if (!bin.count) return;
        const rect = svgEl(&#x27;rect&#x27;, {
          x: M.left + i * bw + 1, y: y(bin.count), width: bw - 2, height: y(0) - y(bin.count), class: &#x27;bar&#x27;,
        }, svg);
        rect.addEventListener(&#x27;mouseenter&#x27;, (e) =&gt; showTip(e, details(chart, bin)));
        rect.addEventListener(&#x27;mousemove&#x27;, (e) =&gt; showTip(e));
        rect.addEventListener(&#x27;mouseleave&#x27;, () =&gt; { tip.style.display = &#x27;none&#x27;; });
      });

      for (let i = 0; i &lt;= chart.bins.length; i++) {
        svgEl(&#x27;text&#x27;, { x: M.left + i * bw, y: H - M.bottom + 16, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;tick&#x27; }, svg).textContent = (i * 10) + &#x27;%&#x27;;
      }
      svgEl(&#x27;text&#x27;, { x: M.left + iw / 2, y: H - 6, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;axis-title&#x27; }, svg)

        .textContent = &#x27;Properties&#x27;;
    }
